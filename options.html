<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雨课堂扩展设置</title>
  <link rel="stylesheet" href="options.css">
  <script defer src="ds-common.js"></script>
  <script defer src="options.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">雨课堂扩展 · 学习助手</span>
      <h1>DeepSeek 问答设置</h1>
      <p>连接 DeepSeek V4.1 Flash，发送题目截图、图片与追问。</p>
    </header>
    <form>
      <label for="api-key">DeepSeek API 密钥</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="256" required>
      <div class="actions">
        <button id="save" type="submit">保存并启用问答</button>
        <button id="clear" type="button">删除密钥并停用</button>
      </div>
    </form>
    <p id="status" role="status"></p>
    <section class="privacy" aria-labelledby="privacy-title">
      <h2 id="privacy-title">权限与隐私</h2>
      <p>密钥保存在当前 Firefox 配置中，不通过 Firefox 同步。提交的消息和图片会发给 DeepSeek，可能产生 API 费用。</p>
      <p>Firefox 的截图接口要求「访问所有网站的数据」。只有你在支持的雨课堂题目页点击「问问DS」时，扩展才截取题目区域。拒绝授权不影响视频续播。</p>
    </section>
  </main>
</body>
</html>
